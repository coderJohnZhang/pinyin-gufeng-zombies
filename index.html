<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="拼音古风大战僵尸">
<title>拼音古风大战僵尸</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
[hidden]{display:none !important}
/* overflow-x 禁用横向滚动；纵向保留，竖排放不下时可滚动，内容不会被裁掉。 */
body{margin:0;background:#1e293b;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#111;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;user-select:none;overflow-x:hidden;overflow-y:auto}
#app{display:flex;flex-direction:column;align-items:flex-start;max-width:100%}

/* 宽屏（平板横屏、PC 宽窗口）：舞台在左，答题面板在右。
   舞台因此能拿到接近整屏的高度，不会被面板挤扁。
   面板高度由 fit() 设成与草坪等高，内容超出时在面板内部滚动。 */
#app.side{flex-direction:row;align-items:flex-start;gap:10px}
#app.side #panel{margin-top:0;flex:0 0 auto;align-self:flex-start;overflow-y:auto}

/* 矮窗口（横屏手机）压缩留白，把高度让给舞台。 */
@media (max-height:520px){body{padding:4px}#panel{margin-top:6px;padding:8px}}

/* #stage 用绝对定位并靠 transform 缩放，它的 900px 固有宽度不能参与父级宽度计算，
   否则窄屏下会把 #app 撑出视口，再由 fit() 读到的视口宽度反向放大，形成正反馈。 */
#stage-wrap{position:relative;overflow:hidden;border-radius:12px;flex:0 0 auto;max-width:100%}
#stage{position:absolute;left:0;top:0;width:872px;height:630px;transform-origin:0 0;overflow:hidden;background:#3f6212}
.layer{position:absolute;left:0;top:0;width:872px;height:630px;pointer-events:none}

/* 草坪之外的部分用「泥土」铺底，避免舞台边缘露出空背景。 */
#house-col{position:absolute;left:0;top:186px;width:116px;height:444px;background:#a16207}
#grid{position:absolute;left:0;top:0;width:872px;height:630px}
.cell{position:absolute;left:0;top:0;width:84px;height:84px;background:#84cc16;cursor:pointer}
.cell.alt{background:#65a30d}
.cell.ready{box-shadow:inset 0 0 0 3px rgba(254,240,138,.9)}
@media (hover:hover){.cell:hover{background:#bef264}}
.house{position:absolute;left:0;top:0;width:90px;height:80px}
.house svg{display:block}

.plant{position:absolute;left:0;top:0;width:72px;height:72px}
.plant svg{display:block}
.zombie{position:absolute;left:0;top:0;width:80px;height:110px;cursor:pointer;pointer-events:auto}
.zombie svg{display:block}
.zombie.target{filter:drop-shadow(0 0 6px #facc15)}
.zombie.eating{filter:saturate(.6)}
.zombie .py{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#fff;border-radius:6px;padding:0 5px;font-size:14px;font-weight:bold;color:#1e3a8a;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.zombie .py.zh{font-size:18px;color:#7c2d12;background:#fef3c7;font-family:"KaiTi","STKaiti","楷体",serif}
.pea{position:absolute;left:0;top:0;width:16px;height:16px}
.pea svg{display:block}
.sun{position:absolute;left:0;top:0;width:56px;height:56px;cursor:pointer;pointer-events:auto;animation:bob 1.2s ease-in-out infinite}
.sun svg{display:block}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-6px}}
.fx{position:absolute;left:0;top:0;font-size:26px;font-weight:bold;color:#fff;text-shadow:0 2px 4px #000;animation:floatup .9s forwards;pointer-events:none;white-space:nowrap}
.fx.good{color:#bef264}
.fx.bad{color:#fca5a5}
@keyframes floatup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-40px}}

#hud{position:absolute;left:0;top:0;width:872px;height:100px;background:linear-gradient(#5b3a1e,#7c5230);color:#fff;z-index:10}
#sun-box{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:6px;font-size:26px;font-weight:bold;background:rgba(0,0,0,.25);padding:4px 12px;border-radius:10px}
#seeds{position:absolute;left:150px;top:6px;display:flex;gap:8px}
.seed{width:86px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #78350f;border-radius:8px;background:#fde68a;cursor:pointer;color:#111;font-family:inherit;padding:2px}
.seed span{font-size:13px}
.seed b{font-size:14px}
.seed.sel{outline:3px solid #facc15}
.seed:disabled{filter:grayscale(.9);opacity:.55;cursor:default}
#hearts{position:absolute;left:470px;top:12px;font-size:22px;color:#f43f5e;min-height:28px}
#progress{position:absolute;left:470px;top:48px;width:140px;height:14px;background:rgba(0,0,0,.3);border-radius:7px;overflow:hidden}
#progress-bar{height:100%;width:0;background:#84cc16;transition:width .3s}
#combo{position:absolute;left:470px;top:68px;font-size:16px;color:#facc15}
/* 右侧功能列：合体大炮与暂停按钮同宽上下排列，贴在状态栏右缘。 */
#btn-cannon{position:absolute;right:10px;top:10px;width:196px;height:38px;border:0;border-radius:8px;background:#f59e0b;color:#111;font-size:16px;font-family:inherit;cursor:pointer}
#btn-cannon:disabled{background:#64748b;color:#cbd5e1;cursor:default}
#btn-pause{position:absolute;right:10px;top:54px;width:196px;height:36px;border:0;border-radius:8px;background:#cbd5e1;color:#111;font-size:15px;font-family:inherit;cursor:pointer}

#panel{margin-top:10px;background:#fff;border-radius:12px;padding:12px}
#level-name{font-size:14px;color:#64748b;margin-bottom:4px}
#status{font-size:18px;margin-bottom:8px;min-height:26px}
#status b{color:#2563eb}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.lbl{width:56px;font-weight:bold;color:#475569}
.card{min-width:52px;padding:8px 10px;border:0;border-radius:8px;color:#fff;font-size:20px;font-family:inherit;cursor:pointer}
.card.init{background:#3b82f6}
.card.fin{background:#ef4444}
.card.tone{background:#eab308;color:#111;font-size:15px}
.card.sel{outline:4px solid #111;outline-offset:1px}
.card.choice{background:#92400e;min-width:76px;font-family:"KaiTi","STKaiti","楷体",serif;font-size:24px}
#choice-sentence{font-size:22px;font-family:"KaiTi","STKaiti","楷体",serif;color:#7c2d12;margin-bottom:8px}
#btn-clear{padding:8px 14px;border:0;border-radius:8px;background:#e2e8f0;font-size:15px;font-family:inherit;cursor:pointer}
#msg{min-height:24px;font-size:16px;color:#334155;margin-top:4px}
#key-hint{font-size:12px;color:#94a3b8;margin-top:6px}

@media (pointer:coarse){
  html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
  body{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  button,.cell,.zombie,.sun,#stage{touch-action:manipulation}
  .card{min-height:52px;min-width:64px;font-size:24px;padding:10px 12px}
  .card.choice{min-width:76px;min-height:56px}
  /* 触屏下卡片放大，状态栏内的摆位随之收紧，保证都落在 100 像素高度内。 */
  .seed{width:96px;height:88px}
  .seed span{font-size:15px}
  #seeds{top:6px}
  #sun-box{top:10px}
  #hearts{top:12px}
  #progress{top:48px}
  #combo{top:68px}
  #btn-cannon{top:8px;right:8px;width:190px;height:40px;font-size:17px}
  #btn-pause{top:52px;right:8px;width:190px;height:40px;font-size:17px}
  #btn-clear{min-height:48px;padding:10px 18px;font-size:16px}
  .box button{min-height:52px;font-size:20px}
  .tile{min-height:72px}
  .card:active,.seed:active,.tile:active,.box button:active,#btn-cannon:active,#btn-pause:active,#btn-clear:active{transform:scale(.95);filter:brightness(.9)}
  #key-hint{display:none}
}

#overlay,#learn{position:fixed;inset:0;background:rgba(15,23,42,.85);display:flex;align-items:center;justify-content:center;z-index:20}
.box{background:#fff;border-radius:14px;padding:24px;text-align:center;max-width:460px;width:90%}
.box.wide{max-width:760px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch}
.box h1{margin:0 0 10px;font-size:26px}
.box p{margin:6px 0 14px;color:#334155;line-height:1.6}
.box button{font-size:18px;padding:10px 16px;margin:6px;border:0;border-radius:10px;background:#22c55e;color:#fff;cursor:pointer;font-family:inherit}
.box button.alt{background:#3b82f6}
.box button:disabled{background:#94a3b8;cursor:default}
.box h3{margin:14px 0 6px;text-align:left;color:#334155}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:92px;padding:8px 4px;border:0;border-radius:10px;background:#e0f2fe;cursor:pointer;font-family:inherit;margin:0}
.tile.wide{width:170px;min-height:64px;background:#fef3c7}
.tile b{display:block;font-size:22px;color:#1d4ed8}
.tile.wide b{color:#7c2d12;font-family:"KaiTi","STKaiti","楷体",serif}
.tile span{font-size:13px;color:#334155}

</style>
</head>

 "idioms": [
  {
   "text": "守株待兔",
   "meaning": "比喻不劳而获，固守陈规",
   "tier": 1
  },
  {
   "text": "亡羊补牢",
   "meaning": "出了问题及时补救",
   "tier": 1
  },
  {
   "text": "画蛇添足",
   "meaning": "多此一举，反而坏事",
   "tier": 1
  },
  {
   "text": "掩耳盗铃",
   "meaning": "自己欺骗自己",
   "tier": 1
  },
  {
   "text": "井底之蛙",
   "meaning": "见识短浅的人",
   "tier": 1
  },
  {
   "text": "刻舟求剑",
   "meaning": "拘泥成法，不知变通",
   "tier": 1
  },
  {
   "text": "望梅止渴",
   "meaning": "用想象安慰自己",
   "tier": 1
  },
  {
   "text": "塞翁失马",
   "meaning": "坏事可能变成好事",
   "tier": 1

  {
   "text": "狐假虎威",
   "meaning": "借别人的势力欺压人",
   "tier": 1
  },
  {
   "text": "叶公好龙",
   "meaning": "口头喜欢，实际并不喜欢",
   "tier": 1
  },
  {
   "text": "拔苗助长",
   "meaning": "违背规律，急于求成",
   "tier": 2
  },
  {
   "text": "一叶障目",
   "meaning": "被局部现象蒙蔽",
   "tier": 2
  },
  {
   "text": "自相矛盾",
   "meaning": "前后说法互相抵触",
   "tier": 2
  },
  {
   "text": "对牛弹琴",
   "meaning": "对不懂道理的人讲道理",
   "tier": 2
  },
  {
   "text": "南辕北辙",
   "meaning": "做法与目标背道而驰",
   "tier": 2
  },
  {
   "text": "坐井观天",
   "meaning": "眼界狭窄，见识有限",
   "tier": 2
  },
  {
   "text": "买椟还珠",
   "meaning": "只重外表，不识真正价值",
   "tier": 2
  },
  {
   "text": "画龙点睛",
   "meaning": "关键处加一笔，使全篇生动",
   "tier": 2
  },
  {
   "text": "事半功倍",
   "meaning": "用力少而收效大",
   "tier": 2
  },
  {
   "text": "精卫填海",
   "meaning": "坚持不懈，克服困难",
   "tier": 2
  },
  {
   "text": "愚公移山",
   "meaning": "只要坚持，就能做成大事",
   "tier": 2
  },
  {
   "text": "高山流水",
   "meaning": "比喻知音难得",
   "tier": 3
  },
  {
   "text": "三顾茅庐",
   "meaning": "诚心诚意地邀请贤才",
   "tier": 3
  },
  {
   "text": "望洋兴叹",
   "meaning": "面对强大事物而感叹无能为力",
   "tier": 3
  },
  {
   "text": "胸有成竹",
   "meaning": "做事之前已有把握",
   "tier": 3
  },
  {
   "text": "中流砥柱",
   "meaning": "在危难中起支柱作用的人",
   "tier": 3
  },
  {
   "text": "一鸣惊人",

   "tier": 3
  },
  {
   "text": "朝三暮四",

   "tier": 3
  },
  {
   "text": "杯弓蛇影",

   "tier": 3
  },
  {
   "text": "精益求精",

   "tier": 2
  },
  {
   "text": "百发百中",

   "tier": 1
  },
  {
   "text": "守口如瓶",
   "meaning": "像瓶口塞住一样，不随便说话",
   "tier": 2
  },
  {
   "text": "三心二意",
   "meaning": "做事不专心，犹豫不定",
   "tier": 1
  },
  {
   "text": "四面八方",
   "meaning": "各个方向",
   "tier": 1
  },
  {
   "text": "五湖四海",
   "meaning": "指全国各地，天下",
   "tier": 2
  },
  {
   "text": "七上八下",
   "meaning": "心里慌乱，不安定",
   "tier": 1
  },
  {
   "text": "九牛一毛",
   "meaning": "比喻极其微小的部分",
   "tier": 2
  },
  {
   "text": "十全十美",
   "meaning": "十分完美，没有缺陷",
   "tier": 1
  },
  {
   "text": "一箭双雕",
   "meaning": "一次行动同时取得两个成果",
   "tier": 2
  },
  {
   "text": "入木三分",
   "meaning": "书法笔力雄健，也比喻分析深刻",
   "tier": 3
  },
  {
   "text": "虎头蛇尾",
   "meaning": "开始声势大，结尾冷清",
   "tier": 2
  },
  {
   "text": "目不转睛",
   "meaning": "注意力高度集中地看",
   "tier": 1
  },
  {
   "text": "不耻下问",
   "meaning": "不以向地位低的人请教为羞耻",
   "tier": 3
  },
  {
   "text": "半途而废",

   "tier": 1
  },
  {
   "text": "废寝忘食",

   "tier": 2
  },
  {
   "text": "草木皆兵",
   "meaning": "形容惊慌过度，疑神疑鬼",
   "tier": 3
  },
  {
   "text": "众志成城",
   "meaning": "大家齐心协力，力量如同城墙般坚固",
   "tier": 2
  },
  {
   "text": "持之以恒",
   "meaning": "长久坚持下去",
   "tier": 2
  },
  {
   "text": "锲而不舍",
   "meaning": "刻一下，不停止，比喻坚持不懈",
   "tier": 3
  },
  {
   "text": "闻鸡起舞",
   "meaning": "听到鸡叫就起床练剑，比喻发奋努力",
   "tier": 3
  },
  {
   "text": "悬梁刺股",
   "meaning": "形容刻苦学习",
   "tier": 3
  },
  {
   "text": "囊萤映雪",
   "meaning": "借萤火虫与雪光读书，形容勤学",
   "tier": 3
  },
  {
   "text": "笨鸟先飞",

   "tier": 3
  }

 "poems": [
  {
   "title": "静夜思",
   "author": "李白",
   "dynasty": "唐",
   "lines": [
    "床前明月光",
    "疑是地上霜",
    "举头望明月",
    "低头思故乡"
   ]
  },
  {
   "title": "登鹳雀楼",
   "author": "王之涣",
   "dynasty": "唐",
   "lines": [
    "白日依山尽",
    "黄河入海流",
    "欲穷千里目",
    "更上一层楼"
   ]
  },
  {
   "title": "春晓",
   "author": "孟浩然",
   "dynasty": "唐",
   "lines": [
    "春眠不觉晓",
    "处处闻啼鸟",
    "夜来风雨声",
    "花落知多少"
   ]
  },
  {
   "title": "相思",
   "author": "王维",
   "dynasty": "唐",
   "lines": [
    "红豆生南国",
    "春来发几枝",
    "愿君多采撷",
    "此物最相思"
   ]
  },
  {
   "title": "江雪",
   "author": "柳宗元",
   "dynasty": "唐",
   "lines": [
    "千山鸟飞绝",
    "万径人踪灭",
    "孤舟蓑笠翁",
    "独钓寒江雪"
   ]
  },
  {
   "title": "悯农",
   "author": "李绅",
   "dynasty": "唐",
   "lines": [
    "锄禾日当午",
    "汗滴禾下土",
    "谁知盘中餐",
    "粒粒皆辛苦"
   ]
  },
  {
   "title": "咏鹅",
   "author": "骆宾王",
   "dynasty": "唐",
   "lines": [
    "鹅鹅鹅",
    "曲项向天歌",
    "白毛浮绿水",
    "红掌拨清波"
   ]
  },
  {
   "title": "望庐山瀑布",
   "author": "李白",
   "dynasty": "唐",
   "lines": [
    "日照香炉生紫烟",
    "遥看瀑布挂前川",
    "飞流直下三千尺",
    "疑是银河落九天"
   ]
  },
  {
   "title": "游子吟",
   "author": "孟郊",
   "dynasty": "唐",
   "lines": [
    "慈母手中线",
    "游子身上衣",
    "临行密密缝",
    "意恐迟迟归",
    "谁言寸草心",
    "报得三春晖"
   ]
  },
  {
   "title": "饮湖上初晴后雨",
   "author": "苏轼",
   "dynasty": "宋",
   "lines": [
    "水光潋滟晴方好",
    "山色空蒙雨亦奇",
    "欲把西湖比西子",
    "淡妆浓抹总相宜"
   ]
  },
  {
   "title": "泊秦淮",
   "author": "杜牧",
   "dynasty": "唐",
   "lines": [
    "烟笼寒水月笼沙",
    "夜泊秦淮近酒家",
    "商女不知亡国恨",
    "隔江犹唱后庭花"
   ]
  },
  {
   "title": "赋得古原草送别",
   "author": "白居易",
   "dynasty": "唐",
   "lines": [
    "离离原上草",
    "一岁一枯荣",
    "野火烧不尽",
    "春风吹又生"
   ]
  },
  {
   "title": "寻隐者不遇",
   "author": "贾岛",
   "dynasty": "唐",
   "lines": [
    "松下问童子",
    "言师采药去",
    "只在此山中",
    "云深不知处"
   ]
  },
  {
   "title": "早发白帝城",
   "author": "李白",
   "dynasty": "唐",
   "lines": [
    "朝辞白帝彩云间",
    "千里江陵一日还",
    "两岸猿声啼不住",
    "轻舟已过万重山"
   ]
  },
  {
   "title": "出塞",
   "author": "王昌龄",
   "dynasty": "唐",
   "lines": [
    "秦时明月汉时关",
    "万里长征人未还",
    "但使龙城飞将在",
    "不教胡马度阴山"
   ]
  }
 ],

          ? pick(content.idioms, rng).text
          : pick(pick(content.poems, rng).lines, rng);
        const idx = Math.floor(rng() * full.length);
        const answer = full[idx];
        const visible = new Set(full);
        const rest = pool.filter(c => c.ch !== answer && !visible.has(c.ch));
        const distractors = pickDistractors(readings.get(answer) || { init: null, fin: null }, rest, level.near || 0, rng);
        return {
          kind: 'choice',
          label: full.slice(0, idx) + '□' + full.slice(idx + 1),
          answerText: full,
          speak: full,
          answer,
          options: shuffle([answer, ...distractors], rng)
        };
      };
    },
    complete(pk) {
      return pk.choice !== null;
    },
    correct(ch, pk) {
      return pk.choice === ch.answer;
    }
  };

  root.PVZ = root.PVZ || {};
  root.PVZ.modes = { pinyin, choice };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.PVZ.modes;

<script>
(function (root) {
  'use strict';

  const D = root.PVZ.data;
  const P = root.PVZ.pinyin;
  const M = root.PVZ.modes;
  const { cell, x0, y0, cols, rows } = D.GRID;

  const PEA_SPEED = 260;
  const EAT_INTERVAL = 0.8;
  const SKY_SUN_EVERY = 10;
  const SKY_SUN_LIFE = 9;
  const FLOWER_SUN_EVERY = 8;
  const FLOWER_FIRST_SUN = 6;
  const CORRECT_SUN = 15;
  const WRONG_PUSH = 40;
  const SUN_VALUE = 25;

  const cellX = col => x0 + col * cell;
  const cellY = row => y0 + row * cell;
  const cellCX = col => cellX(col) + cell / 2;
  const cellCY = row => cellY(row) + cell / 2;

  function createRng(seed) {
    let x = (seed >>> 0) || 1;
    return () => {
      x ^= x << 13;
      x ^= x >>> 17;
      x ^= x << 5;
      return (x >>> 0) / 4294967296;
    };
  }

  function createGame(level, rng, content) {
    const r = rng || Math.random;
    const c = content || root.PVZ.content;
    return {
      level,
      rng: r,
      nextChallenge: M[level.mode].create(level, c, r),
      status: 'playing',
      time: 0,
      sun: 50,
      lives: 3,
      combo: 0,
      bestCombo: 0,
      cannons: 0,
      killed: 0,
      toSpawn: level.zombies,
      spawnTimer: 3,
      skySunTimer: SKY_SUN_EVERY,
      plants: [],
      zombies: [],
      peas: [],
      suns: [],
      target: null,
      pick: { init: null, fin: null, tone: null, choice: null },
      nextId: 1
    };
  }

  const nid = g => g.nextId++;

  function tick(g, dt) {
    const ev = [];
    if (g.status !== 'playing') return ev;
    g.time += dt;
    spawn(g, dt);
    sunDrops(g, dt);
    plantsAct(g, dt, ev);
    zombiesAct(g, dt, ev);
    peasAct(g, dt, ev);
    if (g.status === 'playing' && g.toSpawn === 0 && g.zombies.length === 0) {
      g.status = 'won';
      ev.push({ type: 'win' });
    }
    return ev;
  }

  function spawn(g, dt) {
    if (g.toSpawn <= 0) return;
    g.spawnTimer -= dt;
    if (g.spawnTimer > 0) return;
    g.spawnTimer = g.level.interval * (0.7 + g.rng() * 0.6);
    g.toSpawn--;
    const type = g.rng() < g.level.bucket ? 'bucket' : 'normal';
    const def = D.ZOMBIES[type];
    g.zombies.push({
      id: nid(g),
      type,
      ch: g.nextChallenge(),
      row: Math.floor(g.rng() * rows),
      x: D.STAGE.w + 40,
      hp: def.hp,
      speed: def.speed * g.level.speed,
      eating: null,
      eatTimer: 0
    });
  }

  function sunDrops(g, dt) {
    g.skySunTimer -= dt;
    if (g.skySunTimer <= 0) {
      g.skySunTimer = SKY_SUN_EVERY;
      g.suns.push({
        id: nid(g),
        x: 140 + g.rng() * 680,
        y: 150 + g.rng() * 300,
        value: SUN_VALUE,
        life: SKY_SUN_LIFE
      });
    }
    for (const s of g.suns) s.life -= dt;
    g.suns = g.suns.filter(s => s.life > 0);
  }

  function plantsAct(g, dt, ev) {
    for (const p of g.plants) {
      p.timer -= dt;
      if (p.type === 'sunflower' && p.timer <= 0) {
        p.timer = FLOWER_SUN_EVERY;
        g.suns.push({ id: nid(g), x: cellCX(p.col), y: cellCY(p.row), value: SUN_VALUE, life: SKY_SUN_LIFE });
      }
      if (p.type === 'peashooter' && p.timer <= 0 &&
          g.zombies.some(z => z.row === p.row && z.x > cellCX(p.col) && z.x < D.STAGE.w)) {
        p.timer = D.PLANTS.peashooter.cooldown;
        g.peas.push({ id: nid(g), row: p.row, x: cellCX(p.col) + 30, dmg: 1 });
        ev.push({ type: 'shoot' });
      }
    }
  }

  function zombiesAct(g, dt, ev) {
    const reached = [];
    for (const z of g.zombies) {
      if (z.eating && !g.plants.includes(z.eating)) z.eating = null;
      if (!z.eating) {
        const blocker = g.plants.find(p => p.row === z.row && Math.abs(z.x - cellCX(p.col)) <= cell / 2 + 8);
        if (blocker) z.eating = blocker;
        else z.x -= z.speed * dt;
      }
      if (z.eating) {
        z.eatTimer += dt;
        if (z.eatTimer >= EAT_INTERVAL) {
          z.eatTimer = 0;
          z.eating.hp--;
          if (z.eating.hp <= 0) {
            g.plants = g.plants.filter(p => p !== z.eating);
            z.eating = null;
            ev.push({ type: 'plantDied' });
          }
        }
      }
      if (z.x <= D.HOUSE_LINE) reached.push(z);
    }
    for (const z of reached) {
      g.zombies = g.zombies.filter(o => o !== z);
      if (g.target === z.id) g.target = null;
      g.lives--;
      ev.push({ type: 'lifeLost' });
      if (g.lives <= 0) {
        g.lives = 0;
        g.status = 'lost';
        ev.push({ type: 'lose' });
        return;
      }
    }
  }

  function peasAct(g, dt, ev) {
    for (const p of g.peas) p.x += PEA_SPEED * dt;
    const alive = [];
    for (const p of g.peas) {
      if (p.x > D.STAGE.w) continue;
      const z = g.zombies.find(o => o.row === p.row && Math.abs(o.x - p.x) <= 30);
      if (z) {
        damage(g, z, p.dmg, ev);
        ev.push({ type: 'hit', row: z.row, x: z.x });
      } else {
        alive.push(p);
      }
    }
    g.peas = alive;
  }

  function damage(g, z, dmg, ev) {
    z.hp -= dmg;
    if (z.hp > 0) return;
    g.zombies = g.zombies.filter(o => o !== z);
    if (g.target === z.id) g.target = null;
    g.killed++;
    ev.push({ type: 'kill', row: z.row, x: z.x });
  }

  function nearest(g) {
    return g.zombies.reduce((a, b) => (a === null || b.x < a.x ? b : a), null);
  }

  function autoTarget(g) {
    if (g.zombies.some(z => z.id === g.target)) return;
    const z = nearest(g);
    g.target = z ? z.id : null;
  }

  function previewTarget(g) {
    return g.zombies.find(z => z.id === g.target) || nearest(g);
  }

  function placePlant(g, type, row, col) {
    const def = D.PLANTS[type];
    if (g.status !== 'playing' || !def || g.sun < def.cost) return false;
    if (row < 0 || row >= rows || col < 0 || col >= cols) return false;
    if (g.plants.some(p => p.row === row && p.col === col)) return false;
    g.sun -= def.cost;
    g.plants.push({
      id: nid(g),
      type,
      row,
      col,
      hp: def.hp,
      timer: type === 'sunflower' ? FLOWER_FIRST_SUN : 0
    });
    return true;
  }

  function collectSun(g, id) {
    const s = g.suns.find(o => o.id === id);
    if (!s) return false;
    g.suns = g.suns.filter(o => o !== s);
    g.sun += s.value;
    return true;
  }

  function setTarget(g, id) {
    if (g.zombies.some(z => z.id === id)) g.target = id;
  }

  function setPick(g, kind, value) {
    g.pick[kind] = g.pick[kind] === value ? null : value;
  }

  function clearPick(g) {
    g.pick = { init: null, fin: null, tone: null, choice: null };
  }

  function answer(g) {
    const ev = [];
    if (g.status !== 'playing') return ev;
    const mode = M[g.level.mode];
    if (!mode.complete(g.pick, g.level)) return ev;
    autoTarget(g);
    const z = g.zombies.find(o => o.id === g.target);
    if (!z) {
      clearPick(g);
      ev.push({ type: 'noTarget' });
      return ev;
    }
    if (mode.correct(z.ch, g.pick, g.level)) {
      g.combo++;
      g.bestCombo = Math.max(g.bestCombo, g.combo);
      g.sun += CORRECT_SUN;
      ev.push({ type: 'correct', row: z.row, x: z.x, ch: z.ch });
      damage(g, z, 1, ev);
      if (g.combo % 3 === 0) {
        g.cannons++;
        ev.push({ type: 'cannonReady' });
      }
    } else {
      g.combo = 0;
      for (const o of g.zombies) if (o.row === z.row) o.x -= WRONG_PUSH;
      ev.push({ type: 'wrong', row: z.row, x: z.x, answer: z.ch });
    }
    clearPick(g);
    return ev;
  }

  function useCannon(g) {
    const ev = [];
    if (g.status !== 'playing' || g.cannons <= 0) return ev;
    g.cannons--;
    for (const z of [...g.zombies]) damage(g, z, z.hp, ev);
    ev.push({ type: 'cannon' });
    return ev;
  }

  const api = {
    createRng, createGame, tick, placePlant, collectSun, setTarget, setPick, clearPick,
    answer, useCannon, autoTarget, previewTarget, cellX, cellY, cellCX, cellCY
  };
  root.PVZ = root.PVZ || {};
  root.PVZ.game = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function (root) {
  'use strict';

  let ctx = null;

  function ensure() {
    if (!ctx) {
      const AC = root.AudioContext || root.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, dur, type, vol, delay) {
    const c = ensure();
    if (!c) return;
    const t = c.currentTime + (delay || 0);
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  const sfx = {
    correct() { tone(660, 0.12, 'sine', 0.1); tone(880, 0.16, 'sine', 0.1, 0.09); },
    wrong() { tone(170, 0.3, 'sawtooth', 0.06); },
    shoot() { tone(980, 0.05, 'square', 0.015); },
    kill() { tone(420, 0.15, 'triangle', 0.08); },
    collect() { tone(1320, 0.08, 'triangle', 0.07); },
    place() { tone(220, 0.1, 'triangle', 0.1); },
    cannon() { tone(90, 0.7, 'sawtooth', 0.12); },
    lifeLost() { tone(120, 0.5, 'square', 0.1); },
    win() { tone(523, 0.15, 'triangle', 0.1); tone(659, 0.15, 'triangle', 0.1, 0.15); tone(784, 0.3, 'triangle', 0.1, 0.3); }
  };

  function speak(text) {
    if (!text || !('speechSynthesis' in root)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    root.speechSynthesis.cancel();
    root.speechSynthesis.speak(u);
  }

  root.PVZ = root.PVZ || {};
  root.PVZ.audio = { sfx, speak, unlock: ensure };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function (root) {
  'use strict';

  const G = root.PVZ.game;
  const D = root.PVZ.data;
  const $ = s => document.querySelector(s);

  const layer = {};
  const maps = { plants: new Map(), zombies: new Map(), peas: new Map(), suns: new Map() };
  const seedEls = new Map();
  const cells = [];
  let H = {};

  function el(tag, cls) {
    const n = document.createElement(tag);
    n.className = cls;
    return n;
  }

  function spr(id, w, h) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><use href="#${id}" width="${w}" height="${h}"/></svg>`;
  }

  function place(n, x, y) {
    n.style.transform = `translate(${x}px, ${y}px)`;
  }

  function sync(map, items, parent, make, update) {
    const alive = new Set();
    for (const it of items) {
      alive.add(it.id);
      let n = map.get(it.id);
      if (!n) {
        n = make(it);
        map.set(it.id, n);
        parent.appendChild(n);
      }
      update(n, it);
    }
    for (const [id, n] of map) {
      if (!alive.has(id)) {
        n.remove();
        map.delete(id);
      }
    }
  }

  const makers = {
    plant(p) {
      const n = el('div', 'plant');
      n.innerHTML = spr(p.type, 72, 72);
      return n;
    },
    zombie(z) {
      const n = el('div', 'zombie');
      n.innerHTML = `<div class="py"></div>${spr(z.type === 'bucket' ? 'zombie-bucket' : 'zombie-normal', 80, 110)}`;
      if (z.ch.kind === 'choice') n.querySelector('.py').classList.add('zh');
      const id = z.id;
      n.addEventListener('click', e => { e.stopPropagation(); H.onZombie(id); });
      return n;
    },
    pea() {
      const n = el('div', 'pea');
      n.innerHTML = spr('pea', 16, 16);
      return n;
    },
    sun(s) {
      const n = el('div', 'sun');
      n.innerHTML = spr('sun', 56, 56);
      const id = s.id;
      n.addEventListener('click', () => H.onSun(id));
      return n;
    }
  };

  function init(handlers) {
    H = handlers;
    layer.grid = $('#grid');
    layer.plants = $('#layer-plants');
    layer.zombies = $('#layer-zombies');
    layer.peas = $('#layer-peas');
    layer.suns = $('#layer-suns');
    layer.fx = $('#layer-fx');

    const { cols, rows } = D.GRID;
    for (let row = 0; row < rows; row++) {
      const house = el('div', 'house');
      house.innerHTML = spr('house', 90, 80);
      place(house, 2, G.cellY(row) + 2);
      layer.grid.appendChild(house);
      for (let col = 0; col < cols; col++) {
        const c = el('div', 'cell' + ((row + col) % 2 ? ' alt' : ''));
        place(c, G.cellX(col), G.cellY(row));
        c.addEventListener('click', () => H.onCell(row, col));
        layer.grid.appendChild(c);
        cells.push(c);
      }
    }

    const bar = $('#seeds');
    for (const type of Object.keys(D.PLANTS)) {
      const def = D.PLANTS[type];
      const b = el('button', 'seed');
      b.innerHTML = `${spr(type, 44, 44)}<span>${def.name}</span><b>${def.cost}</b>`;
      b.setAttribute('aria-label', `${def.name}，需要 ${def.cost} 阳光`);
      b.addEventListener('click', () => H.onSeed(type));
      bar.appendChild(b);
      seedEls.set(type, { el: b, cost: def.cost });
    }
  }

  function reset() {
    for (const map of Object.values(maps)) {
      for (const n of map.values()) n.remove();
      map.clear();
    }
    for (const n of [...layer.fx.children]) n.remove();
  }

  function draw(g, seedType) {
    sync(maps.plants, g.plants, layer.plants, makers.plant,
      (n, p) => place(n, G.cellX(p.col) + 6, G.cellY(p.row) + 6));

    sync(maps.zombies, g.zombies, layer.zombies, makers.zombie, (n, z) => {
      place(n, z.x - 40, G.cellCY(z.row) - 88);
      const py = n.querySelector('.py');
      if (py.textContent !== z.ch.label) py.textContent = z.ch.label;
      n.classList.toggle('target', g.target === z.id);
      n.classList.toggle('eating', !!z.eating);
    });

    sync(maps.peas, g.peas, layer.peas, makers.pea,
      (n, p) => place(n, p.x - 8, G.cellCY(p.row) - 14));

    sync(maps.suns, g.suns, layer.suns, makers.sun,
      (n, s) => place(n, s.x - 28, s.y - 28));

    $('#sun-val').textContent = g.sun;
    $('#hearts').textContent = '❤'.repeat(g.lives);
    $('#progress-bar').style.width = (100 * g.killed / g.level.zombies) + '%';
    $('#combo').textContent = g.combo >= 2 ? `连对 ×${g.combo}` : '';
    const cb = $('#btn-cannon');
    cb.textContent = `合体大炮 ×${g.cannons}`;
    cb.disabled = g.cannons === 0;
    for (const c of cells) c.classList.toggle('ready', !!seedType);
    for (const [type, s] of seedEls) {
      s.el.disabled = g.sun < s.cost;
      s.el.classList.toggle('sel', seedType === type);
    }
  }

  function fx(text, x, y, cls) {
    const n = el('div', 'fx ' + (cls || ''));
    n.textContent = text;
    place(n, x, y);
    layer.fx.appendChild(n);
    setTimeout(() => n.remove(), 900);
  }

  root.PVZ.render = { init, reset, draw, fx };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

(function (root) {
  'use strict';

  const SEED_KEYS = ['q', 'w', 'e'];
  const DIGIT_KEYS = ['1', '2', '3', '4'];

  function keyAction(key, ctx) {
    if (key === ' ') return { type: 'cannon' };
    const k = key.length === 1 ? key.toLowerCase() : key;
    const seed = SEED_KEYS.indexOf(k);
    if (seed >= 0) return { type: 'seed', index: seed };
    const digit = DIGIT_KEYS.indexOf(k);
    if (digit >= 0) {
      if (ctx.mode === 'choice') return { type: 'option', index: digit };
      if (ctx.mode === 'pinyin' && ctx.tones) return { type: 'tone', value: digit + 1 };
    }
    return null;
  }

  const api = { keyAction, SEED_KEYS, DIGIT_KEYS };
  root.PVZ = root.PVZ || {};
  root.PVZ.keys = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function (root) {
  'use strict';

  /** 页面四周留白，避开刘海、底部手势条与浏览器 UI。 */
  const PAD = 16;
  /** 舞台与面板之间的间距。 */
  const GAP = 10;
  /**
   * 面板可读宽度区间。
   *
   * 并排时面板不与舞台同宽：太窄拼音卡片会挤成一条，
   * 太宽又会抢走舞台的空间。
   */
  const PANEL_MIN_W = 340;
  const PANEL_MAX_W = 520;
  /** 舞台缩放下限。低于此值拼音卡片已无法辨认。 */
  const MIN_SCALE = 0.34;
  /** 粗指针（触屏）没有最小字号顾虑，允许放大到 1.2；鼠标设备限制为 1。 */
  const COARSE_MAX_SCALE = 1.2;
  const FINE_MAX_SCALE = 1;

  /**
   * 面板高度的兜底估值，仅用于无法测量时的粗算。
   *
   * 真实高度由调用方从 DOM 量出后传入，这里只作缺省值。
   */
  const PANEL_H = 300;

  /**
   * 面板（用户操作区）的尺寸。
   *
   * 并排时与舞台等高，上下时与舞台等宽，两块因此边缘对齐。
   * 并排的宽度由可用宽度决定，上下时高度由内容决定，都不在这里指定。
   *
   * @param {'side'|'stack'} mode 布局模式
   * @param {number} scale 舞台缩放
   * @param {{w:number,h:number}} stage 舞台设计尺寸
   * @param {number} [panelW] 并排时的面板宽度
   */
  function panelSize(mode, scale, stage, panelW) {
    if (mode === 'side') return { width: panelW, height: stage.h * scale };
    return { width: stage.w * scale, height: null };
  }

  function clampScale(scale, coarse) {
    const cap = coarse ? COARSE_MAX_SCALE : FINE_MAX_SCALE;
    return Math.max(MIN_SCALE, Math.min(cap, scale));
  }

  /**
   * 推演竖排布局：面板在舞台正下方，宽度跟随舞台。
   *
   * 面板高度不随缩放变化（内容换行数由面板宽度决定），
   * 因此可用高度要先扣掉面板实际高度与间距。
   */
  function planStacked(availW, availH, stage, coarse, panelH) {
    const scale = clampScale(
      Math.min(availW / stage.w, (availH - panelH - GAP) / stage.h),
      coarse,
    );
    return { mode: 'stack', scale, panelW: stage.w * scale };
  }

  /**
   * 推演并排布局：面板独立成列，不占舞台高度。
   *
   * 先按面板最小宽度算舞台缩放，再把舞台用不完的宽度还给面板，
   * 用新宽度复算一次缩放，得到自洽的缩放与面板宽度。
   */
  function planSide(availW, availH, stage, coarse) {
    let panelW = PANEL_MIN_W;
    let scale = clampScale(
      Math.min((availW - GAP - panelW) / stage.w, availH / stage.h),
      coarse,
    );
    panelW = Math.max(PANEL_MIN_W, Math.min(PANEL_MAX_W, availW - GAP - stage.w * scale));
    scale = clampScale(
      Math.min((availW - GAP - panelW) / stage.w, availH / stage.h),
      coarse,
    );
    return { mode: 'side', scale, panelW };
  }

  /**
   * 选择布局，给出舞台缩放与面板宽度。
   *
   * 竖排把面板堆在舞台下方，宽屏时舞台只能拿到一部分高度；
   * 并排让面板独立成列，舞台吃满整个高度。宽度放得下两列且并排确实更大时选并排，
   * 否则保持竖排。
   *
   * @param {number} vw 视口宽度
   * @param {number} vh 视口高度
   * @param {{w:number,h:number}} stage 舞台设计尺寸
   * @param {boolean} coarse 是否为触屏等粗指针设备
   * @param {number} panelH 竖排时面板的实际高度
   */
  function plan(vw, vh, stage, coarse, panelH) {
    const availW = vw - PAD;
    const availH = vh - PAD;
    const stacked = planStacked(availW, availH, stage, coarse, panelH);
    const side = planSide(availW, availH, stage, coarse);
    const sideFits = availW >= stage.w * MIN_SCALE + GAP + PANEL_MIN_W;
    if (sideFits && side.scale > stacked.scale) return side;
    return stacked;
  }

  /**
   * 单值缩放估算。
   *
   * 需要同时知道布局模式与面板宽度时请用 {@link plan}。
   */
  function computeScale(win, stage, coarse) {
    return plan(win.w, win.h, stage, coarse, PANEL_H).scale;
  }

  const api = { plan, computeScale, panelSize, PAD, GAP, PANEL_H, PANEL_MIN_W, PANEL_MAX_W, MIN_SCALE };
  root.PVZ = root.PVZ || {};
  root.PVZ.layout = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function (root) {
  'use strict';

  const PVZ = root.PVZ;
  const D = PVZ.data;
  const P = PVZ.pinyin;
  const G = PVZ.game;
  const R = PVZ.render;
  const A = PVZ.audio;
  const C = PVZ.content;
  const SAVE_KEY = 'pinyin-gufeng-zombies-save-v1';
  const STEP = 1 / 60;
  const $ = s => document.querySelector(s);

  let g = null;
  let levelIndex = 0;
  let seedType = null;
  let paused = false;
  let raf = 0;
  let last = 0;
  let acc = 0;
  let cardEls = [];
  let choiceEls = [];
  let choiceKey = null;
  const save = readSave();

  function readSave() {
    try {
      return Object.assign({ unlocked: 1, stars: {} }, JSON.parse(localStorage.getItem(SAVE_KEY)));
    } catch (e) {
      return { unlocked: 1, stars: {} };
    }
  }

  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage unavailable */ }
  }

  function msg(t) {
    const el = $('#msg');
    if (el.textContent === t) return;
    el.textContent = t;
    scheduleFit();
  }

  let lastStatus = '';
  function setStatus(html) {
    if (html === lastStatus) return;
    lastStatus = html;
    $('#status').innerHTML = html;
    scheduleFit();
  }

  /**
   * 按视口重排舞台与操作面板。
   *
   * 面板高度取决于它自己的宽度（拼音卡片换行数会变），宽度又取决于舞台缩放，
   * 两者互相依赖。这里先按舞台同宽量出面板高度，再交给 PVZ.layout.plan 统一决策，
   * 得到布局模式、舞台缩放与面板宽度三项结果。
   *
   * 两块按摆放方向对齐：并排时等高，上下时等宽。
   */
  function fit() {
    const coarse = root.matchMedia('(pointer:coarse)').matches;
    const app = $('#app');
    const panel = $('#panel');
    const wrap = $('#stage-wrap');
    // 必须取布局视口而不是 window.innerWidth：后者在内容溢出时会被撑大，
    // 按它算出的缩放又会让内容更宽，形成正反馈。
    const de = document.documentElement;
    const vw = de.clientWidth;
    const vh = de.clientHeight;

    // 量面板尺寸前先清掉上一次的固定尺寸，否则量到的是上一轮的约束值。
    app.classList.remove('side');
    panel.style.width = '';
    panel.style.height = '';

    const estW = PVZ.layout.plan(vw, vh, D.STAGE, coarse, PVZ.layout.PANEL_H).scale * D.STAGE.w;
    panel.style.width = estW + 'px';
    const panelH = panel.getBoundingClientRect().height;

    const chosen = PVZ.layout.plan(vw, vh, D.STAGE, coarse, panelH);
    const s = chosen.scale;
    wrap.style.width = D.STAGE.w * s + 'px';
    wrap.style.height = D.STAGE.h * s + 'px';
    $('#stage').style.transform = `scale(${s})`;

    const size = PVZ.layout.panelSize(chosen.mode, s, D.STAGE, chosen.panelW);
    panel.style.width = size.width + 'px';
    if (chosen.mode === 'side') {
      app.classList.add('side');
      panel.style.height = size.height + 'px';
    }
  }

  /**
   * 内容变化后重排。
   *
   * 面板会因关卡切换、提示文案变长而改变高度，这些都不触发 resize，
   * 需要主动复算一次，否则舞台会压到面板上或留下大片空白。
   */
  let fitPending = false;
  function scheduleFit() {
    if (fitPending) return;
    fitPending = true;
    root.requestAnimationFrame(() => {
      fitPending = false;
      fit();
    });
  }

  function showOverlay(title, body, buttons) {
    $('#ov-title').textContent = title;
    $('#ov-body').textContent = body;
    const box = $('#ov-buttons');
    box.innerHTML = '';
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.textContent = b.label;
      if (b.alt) btn.className = 'alt';
      btn.disabled = !!b.disabled;
      btn.onclick = b.onClick;
      box.appendChild(btn);
    }
    $('#overlay').hidden = false;
  }

  function hideOverlay() { $('#overlay').hidden = true; }

  function showMenu() {
    g = null;
    cancelAnimationFrame(raf);
    const buttons = D.LEVELS.map((lv, i) => {
      const unlocked = i + 1 <= save.unlocked;
      const stars = save.stars[i + 1] || 0;
      const tag = unlocked ? ` ${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}` : '（未解锁）';
      return { label: lv.name + tag, disabled: !unlocked, onClick: () => startLevel(i) };
    });
    buttons.push({ label: '拼音图鉴 · 古风典籍', alt: true, onClick: showLearn });
    showOverlay('拼音古风大战僵尸',
      '拼音关：点僵尸锁定，依次点声母、韵母拼读。古风关：点僵尸锁定，选出缺失的字。拼对发射豌豆，拼错草坪前进，连对三次充能「合体大炮」。',
      buttons);
  }

  function showEnd(won) {
    const hasNext = won && levelIndex + 1 < D.LEVELS.length;
    const body = `消灭 ${g.killed} 只僵尸，最高连对 ${g.bestCombo}。` + (won ? ` 剩余 ${g.lives} 颗心。` : '');
    const buttons = [];
    if (hasNext) buttons.push({ label: '下一关', onClick: () => startLevel(levelIndex + 1) });
    buttons.push({ label: '再玩一次', onClick: () => startLevel(levelIndex) });
    buttons.push({ label: '选关', alt: true, onClick: showMenu });
    showOverlay(won ? '通关！' : '僵尸进屋了', body, buttons);
  }

  function endLevel(won) {
    if (won) {
      save.stars[levelIndex + 1] = Math.max(save.stars[levelIndex + 1] || 0, g.lives);
      save.unlocked = Math.max(save.unlocked, Math.min(levelIndex + 2, D.LEVELS.length));
      writeSave();
    }
    showEnd(won);
  }

  function togglePause() {
    if (!g || g.status !== 'playing') return;
    paused = !paused;
    if (paused) {
      showOverlay('已暂停', '', [
        { label: '继续', onClick: togglePause },
        { label: '选关', alt: true, onClick: showMenu }
      ]);
    } else {
      hideOverlay();
    }
  }

  function showLearn() {
    const grid = $('#learn-grid');
    grid.innerHTML = '';
    const section = (title, items, wide) => {
      const h = document.createElement('h3');
      h.textContent = title;
      grid.appendChild(h);
      const row = document.createElement('div');
      row.className = 'tiles';
      for (const it of items) {
        const t = document.createElement('button');
        t.className = 'tile' + (wide ? ' wide' : '');
        t.innerHTML = `<b>${it.label}</b><span>${it.sample}</span>`;
        t.onclick = () => A.speak(it.speak);
        row.appendChild(t);
      }
      grid.appendChild(row);
    };
    const sampleOf = (key, val) => {
      const s = C.syllables.find(x => x[key] === val);
      return { sample: s ? `${s.py} ${s.hz}` : '', speak: s ? s.hz : '' };
    };
    section('声母', D.INITS.map(i => ({ label: i || '∅', ...sampleOf('init', i) })));
    section('韵母', D.FINS.map(f => ({ label: f, ...sampleOf('fin', f) })));
    section('声调', D.TONE_EXAMPLES.map(([name, py, hz]) => ({ label: name, sample: `${py} ${hz}`, speak: hz })));
    section('成语释义', C.idioms.map(x => ({ label: x.text, sample: x.meaning, speak: x.text })), true);
    section('古诗', C.poems.map(p => ({
      label: p.title, sample: `${p.dynasty}·${p.author}`, speak: p.lines.join('，')
    })), true);
    $('#learn').hidden = false;
  }

  function startLevel(idx) {
    levelIndex = idx;
    g = G.createGame(D.LEVELS[idx], Math.random, C);
    seedType = null;
    paused = false;
    acc = 0;
    last = 0;
    R.reset();
    buildPanel();
    hideOverlay();
    msg(g.level.mode === 'pinyin'
      ? '先选植物再点草坪种下；点僵尸锁定，然后拼读。'
      : '先选植物再点草坪种下；选出僵尸句子里缺失的字。');
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function loop(ts) {
    if (!g) return;
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.25);
    last = ts;
    if (g.status === 'playing' && !paused) {
      acc += dt;
      while (acc >= STEP && g.status === 'playing') {
        handle(G.tick(g, STEP));
        acc -= STEP;
      }
    }
    R.draw(g, seedType);
    updatePanel();
    raf = requestAnimationFrame(loop);
  }

  function handle(events) {
    for (const ev of events) {
      switch (ev.type) {
        case 'kill':
          A.sfx.kill();
          break;
        case 'lifeLost':
          A.sfx.lifeLost();
          msg('僵尸进屋了，失去一颗心！');
          break;
        case 'correct':
          A.sfx.correct();
          msg(`答对了：${ev.ch.answerText}`);
          A.speak(ev.ch.speak);
          R.fx('+15', ev.x - 20, G.cellCY(ev.row) - 110, 'good');
          break;
        case 'wrong':
          A.sfx.wrong();
          msg(`答错了，正确答案是 ${ev.answer.answerText}`);
          R.fx('答错啦', ev.x - 30, G.cellCY(ev.row) - 110, 'bad');
          break;
        case 'cannonReady':
          msg('合体大炮已充能！');
          break;
        case 'noTarget':
          msg('草坪上没有僵尸');
          break;
        case 'cannon':
          A.sfx.cannon();
          msg('合体大炮！清场');
          break;
        case 'win':
          A.sfx.win();
          endLevel(true);
          break;
        case 'lose':
          endLevel(false);
          break;
      }
    }
  }

  function buildPanel() {
    const isPinyin = g.level.mode === 'pinyin';
    $('#pinyin-panel').hidden = !isPinyin;
    $('#choice-panel').hidden = isPinyin;
    cardEls = [];
    choiceEls = [];
    choiceKey = null;
    if (isPinyin) {
      const { inits, fins } = P.cardsFor(C.syllables.filter(s => s.tier <= g.level.tier), D);
      fillRow('#row-init', inits.map(v => ({ kind: 'init', value: v, label: v || '∅' })));
      fillRow('#row-fin', fins.map(v => ({ kind: 'fin', value: v, label: v })));
      $('#row-tone').hidden = !g.level.tones;
      if (g.level.tones) {
        fillRow('#row-tone', [1, 2, 3, 4].map(t => ({ kind: 'tone', value: t, label: D.TONES[t - 1] })));
      }
    }
    $('#level-name').textContent = g.level.name;
    updatePanel();
    scheduleFit();
  }

  function fillRow(sel, items) {
    const row = $(sel);
    row.querySelectorAll('.card').forEach(n => n.remove());
    for (const it of items) {
      const b = document.createElement('button');
      b.className = 'card ' + it.kind;
      b.textContent = it.label;
      b.onclick = () => onCard(it.kind, it.value);
      row.appendChild(b);
      cardEls.push({ kind: it.kind, value: it.value, el: b });
    }
  }

  function renderChoices() {
    const z = G.previewTarget(g);
    const key = z ? z.id : 0;
    if (key === choiceKey) return;
    choiceKey = key;
    const row = $('#row-choice');
    row.querySelectorAll('.card').forEach(n => n.remove());
    choiceEls = [];
    $('#choice-sentence').textContent = z ? z.ch.label : '';
    if (!z) return;
    for (const opt of z.ch.options) {
      const b = document.createElement('button');
      b.className = 'card choice';
      b.textContent = opt;
      b.onclick = () => onCard('choice', opt);
      row.appendChild(b);
      choiceEls.push(b);
    }
  }

  function updatePanel() {
    if (!g) return;
    if (g.level.mode === 'choice') {
      renderChoices();
      const z = G.previewTarget(g);
      setStatus(z ? `目标：<b>${g.target ? '已锁定' : '自动选择最近的僵尸'}</b>` : '草坪上暂无僵尸');
      return;
    }
    const p = g.pick;
    const show = x => (x === null ? '?' : (x === '' ? '零声母' : x));
    let s = `声母：<b>${show(p.init)}</b>　韵母：<b>${show(p.fin)}</b>`;
    if (g.level.tones) s += `　声调：<b>${p.tone === null ? '?' : p.tone}</b>`;
    s += `　目标：<b>${g.target ? '已锁定' : '未选择'}</b>`;
    setStatus(s);
    const cur = { init: p.init, fin: p.fin, tone: p.tone };
    for (const c of cardEls) c.el.classList.toggle('sel', cur[c.kind] === c.value);
  }

  function onCard(kind, value) {
    if (!g || g.status !== 'playing' || paused) return;
    G.setPick(g, kind, value);
    G.autoTarget(g);
    handle(G.answer(g));
    updatePanel();
  }

  function onCell(row, col) {
    if (!g || g.status !== 'playing' || paused || !seedType) return;
    if (G.placePlant(g, seedType, row, col)) {
      A.sfx.place();
      seedType = null;
      msg('已种下');
    } else {
      const cost = D.PLANTS[seedType].cost;
      msg(g.sun < cost ? '阳光不足' : '这里已经有植物了');
    }
  }

  function onSeed(type) {
    if (!g || g.status !== 'playing' || paused) return;
    seedType = seedType === type ? null : type;
    msg(seedType ? `点击草坪种下${D.PLANTS[seedType].name}` : '');
  }

  function onZombie(id) {
    if (!g || paused) return;
    G.setTarget(g, id);
    updatePanel();
  }

  function onSun(id) {
    if (!g || paused) return;
    if (G.collectSun(g, id)) A.sfx.collect();
  }

  function onKey(e) {
    if (e.key === 'Escape') { togglePause(); return; }
    if (e.repeat || !g || paused || !$('#overlay').hidden || !$('#learn').hidden) return;
    const act = PVZ.keys.keyAction(e.key, { mode: g.level.mode, tones: g.level.tones });
    if (!act) return;
    e.preventDefault();
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    if (act.type === 'seed') {
      onSeed(Object.keys(D.PLANTS)[act.index]);
    } else if (act.type === 'cannon') {
      handle(G.useCannon(g));
      updatePanel();
    } else if (act.type === 'option') {
      const z = G.previewTarget(g);
      if (z && z.ch.options && z.ch.options[act.index]) onCard('choice', z.ch.options[act.index]);
    } else if (act.type === 'tone') {
      onCard('tone', act.value);
    }
  }

  root.addEventListener('resize', scheduleFit);
  // 旋转后个别浏览器会先报旧尺寸，再报新尺寸；补一次延迟重排以避免停留在中间态。
  root.addEventListener('orientationchange', () => {
    scheduleFit();
    setTimeout(fit, 120);
    setTimeout(fit, 320);
  });
  document.addEventListener('pointerdown', () => A.unlock());
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', onKey);

  R.init({ onCell, onSeed, onZombie, onSun });
  $('#btn-clear').onclick = () => { if (g) { G.clearPick(g); updatePanel(); } };
  $('#btn-cannon').onclick = () => { if (g && !paused) { handle(G.useCannon(g)); updatePanel(); } };
  $('#btn-pause').onclick = togglePause;
  $('#learn-close').onclick = () => { $('#learn').hidden = true; };

  fit();
  showMenu();
  if ('serviceWorker' in navigator && root.location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline cache unavailable */ });
  }
})(window);

</script>
</body>
</html>
